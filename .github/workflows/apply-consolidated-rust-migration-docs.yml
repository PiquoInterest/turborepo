name: Apply consolidated Rust migration documentation

on:
  push:
    branches:
      - rust/typescript-deprecation
    paths:
      - .github/workflows/apply-consolidated-rust-migration-docs.yml
      - tools/migration/apply_consolidated_rust_migration_docs.py

concurrency:
  group: apply-consolidated-rust-migration-docs
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout the exact updater commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Apply reviewed documentation updates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/migration/apply_consolidated_rust_migration_docs.py
