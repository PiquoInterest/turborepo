name: Repair turbo-workspaces declaration assets

on:
  push:
    branches:
      - rust/typescript-deprecation
    paths:
      - .github/workflows/repair-package-manager-declaration.yml

concurrency:
  group: repair-turbo-workspaces-declaration
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact migration branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: rust/typescript-deprecation
          fetch-depth: 0

      - name: Verify and publish the repaired trigger
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "PiquoInterest/turborepo"
          test "$GITHUB_REF_NAME" = "rust/typescript-deprecation"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:.github/workflows/continue-package-manager-declaration.yml)" = \
            "6bdb188d65cdf2e1f11048ae12c3f4bf48e13436"
          test "$(sha256sum tools/migration/turbo-workspaces-declaration/red-section.rs | awk '{print $1}')" = \
            "45fffb6131cd8150beff16e37eed8986e97e7be9567edbc911a3dab66bf5fcc7"
          test "$(sha256sum tools/migration/turbo-workspaces-declaration/green-section.rs | awk '{print $1}')" = \
            "1f29ba311547288e35b18caef21c8cb505570210765e9b45268b906825fd38c2"

          python3 <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/continue-package-manager-declaration.yml")
          text = path.read_text(encoding="utf-8")
          old = """          rm -rf tools/migration/turbo-workspaces-declaration
          git rm .github/workflows/continue-package-manager-declaration.yml
"""
          new = """          git rm \\
            tools/migration/turbo-workspaces-declaration/red-section.rs \\
            tools/migration/turbo-workspaces-declaration/green-section.rs
          rm -rf tools/migration/turbo-workspaces-declaration
          git rm .github/workflows/continue-package-manager-declaration.yml
"""
          if text.count(old) != 1:
              raise SystemExit("declaration cleanup anchor changed")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-package-manager-declaration.yml
          git add .github/workflows/continue-package-manager-declaration.yml
          git diff --cached --check
          git commit -m "ci(turbo-workspaces): Repair declaration asset names"

          remote_head="$(git ls-remote origin refs/heads/rust/typescript-deprecation | awk 'NR == 1 {print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git push origin HEAD:rust/typescript-deprecation
