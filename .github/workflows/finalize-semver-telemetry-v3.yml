name: Finalize semver and telemetry security tranches

on:
  push:
    branches:
      - rust/typescript-deprecation
    paths:
      - .github/workflows/finalize-semver-telemetry-v3.yml

concurrency:
  group: finalize-semver-telemetry-v3-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      FORCE_COLOR: "0"
      TURBO_TELEMETRY_MESSAGE_DISABLED: "1"

    steps:
      - name: Checkout the sole migration branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: rust/typescript-deprecation
          fetch-depth: 0

      - name: Verify repository and branch identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "PiquoInterest/turborepo"
          test "$GITHUB_REF_NAME" = "rust/typescript-deprecation"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Patch and apply the reviewed semver implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/migration/repair_create_node_semver_matcher.py
          python3 tools/migration/apply_create_node_semver_matcher.py implement

      - name: Set up the repository Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          cache: false
          save-cache: false

      - name: Generate and validate the constrained semver graph
        shell: bash
        run: |
          set -euo pipefail
          cp Cargo.lock /tmp/semver-Cargo.lock.original
          cargo check -p create-turbo-rs --all-targets
          python3 <<'PY'
          import tomllib
          from pathlib import Path

          def load(path):
              return tomllib.loads(Path(path).read_text(encoding="utf-8"))

          before = load("/tmp/semver-Cargo.lock.original")
          after = load("Cargo.lock")

          def key(package):
              return package["name"], package["version"], package.get("source", "")

          before_packages = {key(package): package for package in before.get("package", [])}
          after_packages = {key(package): package for package in after.get("package", [])}
          if set(before_packages) != set(after_packages):
              raise SystemExit("semver update changed lockfile package identities")

          target = ("create-turbo-rs", "0.1.0", "")
          for package_key, original in before_packages.items():
              current = after_packages[package_key]
              if package_key == target:
                  old_dependencies = set(original.get("dependencies", []))
                  new_dependencies = set(current.get("dependencies", []))
                  if new_dependencies != old_dependencies | {"node-semver"}:
                      raise SystemExit("create-turbo-rs lock delta is not exactly node-semver")
                  old_metadata = dict(original)
                  new_metadata = dict(current)
                  old_metadata.pop("dependencies", None)
                  new_metadata.pop("dependencies", None)
                  if old_metadata != new_metadata:
                      raise SystemExit("create-turbo-rs lock metadata changed")
              elif original != current:
                  raise SystemExit(f"unreviewed lock record changed: {package_key}")

          versions = [
              package["version"]
              for package in after.get("package", [])
              if package.get("name") == "node-semver"
          ]
          if versions != ["2.2.0"]:
              raise SystemExit(f"expected node-semver 2.2.0, found {versions}")
          PY
          cargo fmt --all
          cargo fmt --all --check
          cargo check --locked -p create-turbo-rs --all-targets
          cargo test --locked -p create-turbo-rs --all-targets
          cargo clippy --locked -p create-turbo-rs --all-targets -- -D warnings
          if grep -R --line-number --fixed-strings 'unsafe {' \
            packages/create-turbo/rust/src/package_manager_install_policy.rs \
            packages/create-turbo/rust/tests/package_manager_install_policy_*.rs; then
            echo "semver tranche introduced unsafe code" >&2
            exit 1
          fi

      - name: Set up Node and install the locked workspace
        uses: ./.github/actions/setup-node
        with:
          node-version: 24

      - name: Validate the TypeScript semver oracle
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec oxfmt --check packages/turbo-workspaces/__tests__/install-meta.test.ts
          pnpm --filter @turbo/workspaces exec jest --runInBand --coverage=false \
            __tests__/install-meta.test.ts \
            __tests__/install-security.test.ts

      - name: Commit semver GREEN and isolated rustfmt repair
        id: semver
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Cargo.toml \
            Cargo.lock \
            packages/create-turbo/rust/Cargo.toml \
            packages/create-turbo/rust/src/lib.rs \
            packages/create-turbo/rust/src/package_manager_install_policy.rs \
            packages/create-turbo/rust/tests/package_manager_install_policy_parity.rs
          git diff --cached --check
          git commit -m "feat(create-turbo): Implement strict bounded Node semver matcher"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          if ! git diff --quiet -- packages/turbo-utils/rust/tests/network_authority_bounds.rs; then
            git add packages/turbo-utils/rust/tests/network_authority_bounds.rs
            test "$(git diff --cached --name-only)" = \
              "packages/turbo-utils/rust/tests/network_authority_bounds.rs"
            git diff --cached --check
            git commit -m "style(turbo-utils): Restore network authority rustfmt output"
          fi

      - name: Record semver evidence and remove obsolete automation
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/migration/apply_create_node_semver_matcher.py \
            document "${{ steps.semver.outputs.sha }}"
          rm -f \
            .github/workflows/repair-create-node-semver-matcher.yml \
            .github/workflows/finalize-create-node-semver-matcher.yml \
            .github/workflows/finalize-create-node-semver-v2.yml \
            tools/migration/repair_create_node_semver_matcher.py
          git add -A
          git diff --cached --check
          python3 <<'PY'
          import subprocess
          allowed = {
              ".github/workflows/apply-create-node-semver-matcher.yml",
              ".github/workflows/repair-create-node-semver-matcher.yml",
              ".github/workflows/finalize-create-node-semver-matcher.yml",
              ".github/workflows/finalize-create-node-semver-v2.yml",
              "tools/migration/apply_create_node_semver_matcher.py",
              "tools/migration/repair_create_node_semver_matcher.py",
              "packages/create-turbo/rust/PACKAGE_MANAGER_INSTALL_POLICY_DIVERGENCES.md",
              "packages/create-turbo/rust/README.md",
              "packages/create-turbo/rust/PARITY_MATRIX.md",
              "packages/create-turbo/rust/SECURITY.md",
              "docs/typescript-deprecation.md",
              "docs/rust-migration-security-findings.md",
          }
          changed = set(subprocess.check_output(
              ["git", "diff", "--cached", "--name-only"], text=True
          ).splitlines())
          if changed - allowed:
              raise SystemExit(f"unexpected semver documentation paths: {sorted(changed - allowed)}")
          PY
          git commit -m "docs(create-turbo): Record strict Node semver security"

      - name: Apply the telemetry path-boundary repair
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              path = Path(path)
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"reviewed telemetry anchor changed in {path}: {old[:120]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          source = "crates/turborepo-telemetry/src/events/package/config.rs"
          replace_once(
              source,
              '''fn write_config_atomically(
              path: &AbsoluteSystemPathBuf,
              config: &PackageTelemetryConfigContents,
          ) -> Result<(), PackageTelemetryError> {
              if let Ok(metadata) = fs::symlink_metadata(path.as_path()) {
          ''',
              '''fn write_config_atomically(
              path: &AbsoluteSystemPathBuf,
              config: &PackageTelemetryConfigContents,
          ) -> Result<(), PackageTelemetryError> {
              let path = path.as_path().as_std_path();

              if let Ok(metadata) = fs::symlink_metadata(path) {
          ''',
          )
          replace_once(
              source,
              '''    let parent = path
                  .as_path()
                  .parent()
                  .ok_or(PackageTelemetryError::ConfigPath)?;
          ''',
              '''    let parent = path.parent().ok_or(PackageTelemetryError::ConfigPath)?;
          ''',
          )
          replace_once(
              source,
              '''    let temporary = temporary_path(path.as_path());
              let result = write_temporary_file(&temporary, &serialized)
                  .and_then(|()| replace_file(&temporary, path.as_path()));
          ''',
              '''    let temporary = temporary_path(path);
              let result = write_temporary_file(&temporary, &serialized)
                  .and_then(|()| replace_file(&temporary, path));
          ''',
          )

          tests = Path("crates/turborepo-telemetry/tests/package_security.rs")
          text = tests.read_text(encoding="utf-8")
          test_name = "fn symlinked_config_parent_is_rejected_without_writing_through_the_link()"
          if test_name in text:
              raise SystemExit("telemetry parent-symlink regression already exists")
          tests.write_text(text.rstrip() + '''


          #[cfg(unix)]
          #[test]
          fn symlinked_config_parent_is_rejected_without_writing_through_the_link() {
              use std::os::unix::fs::symlink;

              let temp = tempfile::tempdir().unwrap();
              let root = AbsoluteSystemPathBuf::try_from(temp.path()).unwrap();
              let real_parent = root.join_component("real");
              let linked_parent = root.join_component("linked");
              std::fs::create_dir_all(real_parent.as_path()).unwrap();
              symlink(real_parent.as_path(), linked_parent.as_path()).unwrap();

              let target = real_parent.join_component("telemetry.json");
              let linked_config = linked_parent.join_component("telemetry.json");

              assert!(PackageTelemetryConfig::new(linked_config).is_err());
              assert!(!target.exists());
          }
          ''', encoding="utf-8")

          workflow = Path(".github/workflows/rust-migration-validate.yml")
          text = workflow.read_text(encoding="utf-8")
          anchor = "      - packages/*/rust/**\n"
          if text.count(anchor) != 2:
              raise SystemExit("migration workflow path anchors changed")
          text = text.replace(anchor, anchor + "      - crates/turborepo-telemetry/**\n")
          old = "          PY\n            echo '__MIGRATION_PACKAGES__'\n"
          new = "          PY\n            echo 'turborepo-telemetry'\n            echo '__MIGRATION_PACKAGES__'\n"
          if text.count(old) != 1:
              raise SystemExit("migration package-list anchor changed")
          workflow.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Validate and commit the telemetry GREEN
        id: telemetry
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all --check
          git diff --check
          python3 <<'PY'
          import subprocess
          allowed = {
              ".github/workflows/rust-migration-validate.yml",
              "crates/turborepo-telemetry/src/events/package/config.rs",
              "crates/turborepo-telemetry/tests/package_security.rs",
          }
          changed = set(subprocess.check_output(
              ["git", "diff", "--name-only"], text=True
          ).splitlines())
          if changed != allowed:
              raise SystemExit(f"telemetry GREEN path set changed: {sorted(changed)}")
          PY
          cargo check --locked -p turborepo-telemetry --all-targets
          cargo test --locked -p turborepo-telemetry --all-targets
          cargo clippy --locked -p turborepo-telemetry --all-targets -- -D warnings
          if grep -R --line-number --fixed-strings 'unsafe {' \
            crates/turborepo-telemetry/src/events/package/config.rs \
            crates/turborepo-telemetry/tests/package_security.rs; then
            echo "telemetry path tranche introduced unsafe code" >&2
            exit 1
          fi
          git diff --exit-code -- Cargo.toml Cargo.lock
          git add \
            .github/workflows/rust-migration-validate.yml \
            crates/turborepo-telemetry/src/events/package/config.rs \
            crates/turborepo-telemetry/tests/package_security.rs
          git diff --cached --check
          git commit -m "fix(telemetry): Bridge validated config paths safely"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Record focused telemetry evidence
        shell: bash
        run: |
          set -euo pipefail
          cat >> crates/turborepo-telemetry/README.md <<EOF

          ## Package-facing config path boundary

          The config writer now converts the validated Camino path once to a borrowed standard-library path before target checks, parent validation, temporary-file construction, and replacement. Commit \`${{ steps.telemetry.outputs.sha }}\` adds no allocation, lossy conversion, normalization, canonicalization, dependency, process, network authority, or unsafe code. A Unix regression proves a symlinked parent cannot redirect config creation. Descriptor-relative ancestor identity and Windows reparse-point/atomic-replacement closure remain required before production cutover.
          EOF
          rm -f .github/workflows/finalize-semver-telemetry-v3.yml
          git add \
            crates/turborepo-telemetry/README.md \
            .github/workflows/finalize-semver-telemetry-v3.yml
          git diff --cached --check
          git commit -m "docs(telemetry): Record config path security boundary"

      - name: Install source-build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes capnproto
          capnp --version

      - name: Set up the repository Zig toolchain
        uses: ./.github/actions/setup-zig
        with:
          version: "0.15.2"

      - name: Prepare a temporary source-compatible Rust graph
        shell: bash
        run: |
          set -euo pipefail
          cp Cargo.toml /tmp/source-build-Cargo.toml.original
          cp Cargo.lock /tmp/source-build-Cargo.lock.original
          python3 <<'PY'
          from pathlib import Path
          path = Path("Cargo.toml")
          text = path.read_text(encoding="utf-8")
          replacements = {
              'biome_diagnostics = { version = "0.5.7" }': 'biome_diagnostics = { version = "=0.5.7" }',
              'biome_formatter = { version = "0.5.7" }': 'biome_formatter = { version = "=0.5.7" }',
              'biome_json_parser = { version = "0.5.7" }': 'biome_json_parser = { version = "=0.5.7" }',
              'biome_json_formatter = { version = "0.5.7" }': 'biome_json_formatter = { version = "=0.5.7" }',
              'biome_json_syntax = { version = "0.5.7" }': 'biome_json_syntax = { version = "=0.5.7" }',
              'unrs_resolver = "1.11.1"': 'unrs_resolver = "=1.11.1"',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"source-build dependency anchor changed: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY

          package_is_locked() {
            python3 - "$1" "$2" <<'PY'
          import sys, tomllib
          from pathlib import Path
          name, version = sys.argv[1:]
          lock = tomllib.loads(Path("Cargo.lock").read_text(encoding="utf-8"))
          raise SystemExit(0 if any(
              package.get("name") == name and package.get("version") == version
              for package in lock.get("package", [])
          ) else 1)
          PY
          }
          downgrade_if_locked() {
            if package_is_locked "$1" "$2"; then
              cargo update -p "$1@$2" --precise "$3"
            fi
          }
          downgrade_if_locked biome_console 0.5.8 0.5.7
          downgrade_if_locked biome_diagnostics 0.5.8 0.5.7
          downgrade_if_locked biome_parser 0.5.8 0.5.7
          downgrade_if_locked biome_rowan 0.5.8 0.5.7
          downgrade_if_locked biome_string_case 0.5.8 0.5.7
          downgrade_if_locked biome_text_edit 0.5.8 0.5.7
          downgrade_if_locked biome_text_size 0.5.8 0.5.7
          downgrade_if_locked biome_unicode_table 0.5.9 0.5.7
          downgrade_if_locked unrs_resolver 1.12.2 1.11.1

      - name: Build the exact current Turbo hook binary
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p turbo --bin turbo
          test -x "$GITHUB_WORKSPACE/target/debug/turbo"
          echo "$GITHUB_WORKSPACE/target/debug" >> "$GITHUB_PATH"
          "$GITHUB_WORKSPACE/target/debug/turbo" --version

      - name: Restore the committed dependency graph
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=HEAD -- Cargo.toml Cargo.lock
          git diff --exit-code -- Cargo.toml Cargo.lock

      - name: Preflight and push through unchanged repository hooks
        shell: bash
        run: |
          set -euo pipefail
          test -x "$GITHUB_WORKSPACE/target/debug/turbo"
          command -v turbo
          sh .husky/pre-push
          test -z "$(git status --porcelain)"
          git config --unset-all remote.origin.pushurl || true
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          remote_head="$(git ls-remote origin refs/heads/rust/typescript-deprecation | awk '{print $1}')"
          if [[ "$remote_head" != "$GITHUB_SHA" ]]; then
            echo "integration branch moved during validation: $remote_head" >&2
            exit 1
          fi
          GIT_TERMINAL_PROMPT=0 git push origin HEAD:rust/typescript-deprecation
