name: Implement secure redirect chain state

on:
  push:
    branches:
      - rust/typescript-deprecation
    paths:
      - .github/workflows/implement-redirect-chain.yml

concurrency:
  group: implement-secure-redirect-chain
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout the integration branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: rust/typescript-deprecation
          fetch-depth: 0

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          cache: false
          save-cache: false

      - name: Apply the GREEN redirect-chain implementation
        shell: python
        run: |
          from pathlib import Path

          network_path = Path("packages/turbo-utils/rust/src/network.rs")
          network = network_path.read_text(encoding="utf-8")
          marker = "pub struct RedirectChain<'a>"
          addition = r'''

/// Stateful redirect policy for one request chain.
///
/// The chain owns the redirect count and the authorization provenance of the
/// request that actually reached the current URL. Once authorization is
/// stripped by a cross-origin redirect, later hops cannot reconstruct it from
/// the destination hostname alone.
pub struct RedirectChain<'a> {
    environment: &'a NetworkEnvironment,
    current_url: String,
    authorization_header: Option<String>,
    proxy_url: Option<String>,
    redirect_hops: usize,
}

impl<'a> RedirectChain<'a> {
    pub fn new(
        initial_url: &str,
        environment: &'a NetworkEnvironment,
    ) -> Result<Self, NetworkPolicyError> {
        let initial =
            parse_absolute_url(initial_url).ok_or(NetworkPolicyError::InvalidRequestUrl)?;
        if !is_http_request_scheme(initial.scheme)
            || parse_request_endpoint(initial).is_none()
        {
            return Err(NetworkPolicyError::InvalidRequestUrl);
        }

        Ok(Self {
            environment,
            current_url: initial_url.to_owned(),
            authorization_header: github_authorization_header(initial_url, environment),
            proxy_url: proxy_for_url(initial_url, environment)?,
            redirect_hops: 0,
        })
    }

    #[must_use]
    pub fn current_url(&self) -> &str {
        &self.current_url
    }

    #[must_use]
    pub const fn redirect_hops(&self) -> usize {
        self.redirect_hops
    }

    #[must_use]
    pub fn current_policy(&self) -> RedirectRequestPolicy {
        RedirectRequestPolicy {
            authorization_header: self.authorization_header.clone(),
            proxy_url: self.proxy_url.clone(),
        }
    }

    pub fn follow(
        &mut self,
        target_url: &str,
    ) -> Result<RedirectRequestPolicy, NetworkPolicyError> {
        let next_hop = self
            .redirect_hops
            .checked_add(1)
            .filter(|hop| *hop <= REDIRECT_MAX_HOPS)
            .ok_or(NetworkPolicyError::RedirectLimitExceeded)?;

        let source = parse_absolute_url(&self.current_url)
            .ok_or(NetworkPolicyError::InvalidRequestUrl)?;
        let target =
            parse_absolute_url(target_url).ok_or(NetworkPolicyError::InvalidRequestUrl)?;
        if !is_http_request_scheme(source.scheme) || !is_http_request_scheme(target.scheme) {
            return Err(NetworkPolicyError::InvalidRequestUrl);
        }

        let source_endpoint =
            parse_request_endpoint(source).ok_or(NetworkPolicyError::InvalidRequestUrl)?;
        let target_endpoint =
            parse_request_endpoint(target).ok_or(NetworkPolicyError::InvalidRequestUrl)?;

        if source.scheme.eq_ignore_ascii_case("https")
            && target.scheme.eq_ignore_ascii_case("http")
        {
            return Err(NetworkPolicyError::InsecureRedirect);
        }

        let authorization_header = if self.authorization_header.is_some()
            && same_request_origin(source, source_endpoint, target, target_endpoint)
        {
            github_authorization_header(target_url, self.environment)
        } else {
            None
        };
        let proxy_url = proxy_for_url(target_url, self.environment)?;
        let policy = RedirectRequestPolicy {
            authorization_header: authorization_header.clone(),
            proxy_url: proxy_url.clone(),
        };

        self.current_url.clear();
        self.current_url.push_str(target_url);
        self.authorization_header = authorization_header;
        self.proxy_url = proxy_url;
        self.redirect_hops = next_hop;

        Ok(policy)
    }
}
'''
          if marker not in network:
              network_path.write_text(network.rstrip() + addition + "\n", encoding="utf-8")

          entry_path = Path("packages/turbo-utils/rust/src/entry.rs")
          entry = entry_path.read_text(encoding="utf-8")
          old = "NetworkPolicyError, PROXY_URL_MAX_CHARS, REDIRECT_MAX_HOPS, RedirectRequestPolicy,"
          new = "NetworkPolicyError, PROXY_URL_MAX_CHARS, REDIRECT_MAX_HOPS, RedirectChain, RedirectRequestPolicy,"
          if new not in entry:
              if entry.count(old) != 1:
                  raise SystemExit("network export anchor changed")
              entry = entry.replace(old, new, 1)
              entry_path.write_text(entry, encoding="utf-8")

          test_path = Path("packages/turbo-utils/rust/tests/redirect_chain_security.rs")
          test = test_path.read_text(encoding="utf-8")
          test = test.replace("chain.current_policy()?", "chain.current_policy()")
          test_path.write_text(test, encoding="utf-8")

      - name: Format and verify the scoped diff
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          unexpected="$(git diff --name-only | grep -v -E '^(packages/turbo-utils/rust/src/(entry|network)\.rs|packages/turbo-utils/rust/tests/redirect_chain_security\.rs)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected files changed:" >&2
            echo "$unexpected" >&2
            exit 1
          fi

      - name: Run focused redirect tests
        run: >-
          cargo test --locked -p turbo-utils-rs
          --test redirect_chain_security
          --test redirect_policy_parity
          --test redirect_policy_security

      - name: Check and lint turbo-utils
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked -p turbo-utils-rs --all-targets
          cargo clippy --locked -p turbo-utils-rs --all-targets -- -D warnings

      - name: Commit GREEN and remove the one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/implement-redirect-chain.yml
          git add packages/turbo-utils/rust/src/entry.rs \
                  packages/turbo-utils/rust/src/network.rs \
                  packages/turbo-utils/rust/tests/redirect_chain_security.rs
          git commit -m "fix(turbo-utils): Preserve redirect authorization provenance"
          git pull --rebase origin rust/typescript-deprecation
          git push origin HEAD:rust/typescript-deprecation
