name: Validate create-turbo terminal security tranche

on:
  push:
    branches:
      - rust/create-turbo-terminal-security
    paths:
      - .github/workflows/validate-create-turbo-terminal-security.yml
      - packages/create-turbo/**

concurrency:
  group: validate-create-turbo-terminal-security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-security-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact tranche head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up repository Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          cache: false
          save-cache: false

      - name: Run focused Rust security contract
        run: cargo test --locked -p create-turbo-rs --test transform_diagnostic_security

  typescript-security-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact tranche head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 12.0.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run focused TypeScript security contract
        run: >-
          pnpm --filter create-turbo exec jest
          __tests__/transform-error-security.test.ts
          --runInBand
          --coverage=false
