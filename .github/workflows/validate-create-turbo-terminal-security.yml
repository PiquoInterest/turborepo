name: Validate create-turbo terminal security tranche

on:
  push:
    branches:
      - rust/create-turbo-terminal-security
    paths:
      - .github/workflows/validate-create-turbo-terminal-security.yml
      - tools/migration/apply_create_turbo_terminal_security_docs.py
      - tools/migration/finalize_create_turbo_terminal_security_docs.py
      - packages/create-turbo/**

concurrency:
  group: validate-create-turbo-terminal-security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-security-contract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact tranche head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up repository Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          cache: false
          save-cache: false

      - name: Validate the complete create-turbo Rust crate
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo check --locked -p create-turbo-rs --all-targets
          cargo test --locked -p create-turbo-rs --all-targets
          cargo clippy --locked -p create-turbo-rs --all-targets -- -D warnings

  typescript-security-contract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact tranche head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 12.0.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Print the exact Oxfmt rewrite
        run: |
          set -euo pipefail
          pnpm exec oxfmt \
            packages/create-turbo/src/commands/create/index.ts \
            packages/create-turbo/src/transforms/errors.ts \
            packages/create-turbo/src/transforms/terminal.ts \
            packages/create-turbo/__tests__/transform-error-security.test.ts
          git diff --exit-code -- \
            packages/create-turbo/src/commands/create/index.ts \
            packages/create-turbo/src/transforms/errors.ts \
            packages/create-turbo/src/transforms/terminal.ts \
            packages/create-turbo/__tests__/transform-error-security.test.ts

      - name: Type-check create-turbo
        run: >-
          pnpm --filter create-turbo exec tsc
          --noEmit
          --project tsconfig.json

      - name: Run focused TypeScript security contract
        run: >-
          pnpm --filter create-turbo exec jest
          __tests__/transform-error-security.test.ts
          --runInBand
          --coverage=false

  record-reviewed-evidence:
    if: >-
      ${{
        github.actor != 'github-actions[bot]' &&
        needs.rust-security-contract.result == 'success' &&
        needs.typescript-security-contract.result == 'success'
      }}
    needs:
      - rust-security-contract
      - typescript-security-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout the exact focused branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: rust/create-turbo-terminal-security
          fetch-depth: 0

      - name: Refuse stale validation results
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Apply reviewed parity and security documentation
        run: python tools/migration/finalize_create_turbo_terminal_security_docs.py

      - name: Commit the reviewed evidence
        run: |
          set -euo pipefail
          test ! -e .github/workflows/validate-create-turbo-terminal-security.yml
          test ! -e tools/migration/apply_create_turbo_terminal_security_docs.py
          test ! -e tools/migration/finalize_create_turbo_terminal_security_docs.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: Record terminal diagnostic hardening"
          git push origin HEAD:rust/create-turbo-terminal-security
