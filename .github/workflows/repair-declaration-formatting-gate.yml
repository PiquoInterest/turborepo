name: Repair turbo-workspaces declaration formatting gate

on:
  push:
    branches:
      - rust/typescript-deprecation
    paths:
      - .github/workflows/repair-declaration-formatting-gate.yml
      - tools/migration/repair_declaration_formatting_gate.sh

concurrency:
  group: repair-turbo-workspaces-declaration-formatting
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout the exact migration branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: rust/typescript-deprecation
          fetch-depth: 0

      - name: Set up Node and locked JavaScript dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: 24

      - name: Set up repository Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          cache: false
          save-cache: false

      - name: Install immutable Turbo build prerequisites
        shell: bash
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes capnproto

      - name: Set up repository Zig toolchain
        uses: ./.github/actions/setup-zig
        with:
          version: "0.15.2"

      - name: Apply and publish the two sequential formatting repairs
        shell: bash
        run: bash tools/migration/repair_declaration_formatting_gate.sh
