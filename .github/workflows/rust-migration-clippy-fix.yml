name: Rust migration one-shot Clippy fix

on:
  push:
    branches:
      - rust/typescript-deprecation
    paths:
      - .github/workflows/rust-migration-clippy-fix.yml

permissions:
  contents: write

concurrency:
  group: rust-migration-one-shot-clippy-fix
  cancel-in-progress: false

jobs:
  fix:
    if: >-
      github.repository == 'PiquoInterest/turborepo' &&
      github.ref == 'refs/heads/rust/typescript-deprecation'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout exact migration branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: rust/typescript-deprecation
          fetch-depth: 1
          persist-credentials: true

      - name: Set up repository Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache-key: rust-typescript-deprecation-clippy-fix
          save-cache: false

      - name: Apply exact lint fixes
        shell: python
        run: |
          from pathlib import Path

          managers = Path("packages/turbo-utils/rust/src/managers.rs")
          managers_text = managers.read_text(encoding="utf-8")
          redundant = "            let runner = runner;\n"
          count = managers_text.count(redundant)
          if count != 10:
              raise SystemExit(f"expected 10 redundant runner bindings, found {count}")
          managers.write_text(managers_text.replace(redundant, ""), encoding="utf-8")

          project = Path("packages/turbo-utils/rust/src/project.rs")
          project_text = project.read_text(encoding="utf-8")
          replacements = {
              ".find(|character| matches!(character, '/' | '?' | '#'))": ".find(['/', '?', '#'])",
              ".find(|character| matches!(character, '?' | '#'))": ".find(['?', '#'])",
          }
          for old, new in replacements.items():
              if project_text.count(old) != 1:
                  raise SystemExit(f"expected exactly one occurrence of {old!r}")
              project_text = project_text.replace(old, new)
          project.write_text(project_text, encoding="utf-8")

          parity = Path("packages/turbo-utils/rust/tests/project_parity.rs")
          parity_text = parity.read_text(encoding="utf-8")
          old = "    let mut source = FakeSource::default();\n    source.example_exists = false;\n"
          new = (
              "    let source = FakeSource {\n"
              "        example_exists: false,\n"
              "        ..FakeSource::default()\n"
              "    };\n"
          )
          if parity_text.count(old) != 1:
              raise SystemExit("expected exactly one default-then-reassign test initializer")
          parity.write_text(parity_text.replace(old, new), encoding="utf-8")

      - name: Validate formatted, compiled, tested, and lint-clean result
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo check --locked -p turbo-ignore-rs -p turbo-utils-rs --all-targets
          cargo test --locked -p turbo-ignore-rs -p turbo-utils-rs --all-targets
          cargo clippy --locked -p turbo-ignore-rs -p turbo-utils-rs --all-targets -- -D warnings

      - name: Remove one-shot workflow and validate scope
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/rust-migration-clippy-fix.yml

          unexpected="$({
            git diff --name-only --diff-filter=ACMRTUXB
            git diff --name-only --diff-filter=D
          } | sort -u | grep -Ev '^(packages/turbo-utils/rust/src/(managers|project)\.rs|packages/turbo-utils/rust/tests/project_parity\.rs|\.github/workflows/rust-migration-clippy-fix\.yml$)' || true)"

          if [[ -n "$unexpected" ]]; then
            printf 'Clippy fix touched files outside the approved scope:\n%s\n' "$unexpected" >&2
            exit 1
          fi

          git diff --check

      - name: Commit fixes without rewriting history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            packages/turbo-utils/rust/src/managers.rs \
            packages/turbo-utils/rust/src/project.rs \
            packages/turbo-utils/rust/tests/project_parity.rs \
            .github/workflows/rust-migration-clippy-fix.yml
          git commit -m 'fix: Resolve Rust migration Clippy findings'
          git push origin HEAD:rust/typescript-deprecation
