name: Rust migration one-shot Clippy fix

on:
  push:
    branches:
      - rust/typescript-deprecation
    paths:
      - .github/workflows/rust-migration-clippy-fix.yml

permissions:
  contents: write

concurrency:
  group: rust-migration-one-shot-clippy-fix
  cancel-in-progress: false

jobs:
  fix:
    if: >-
      github.repository == 'PiquoInterest/turborepo' &&
      github.ref == 'refs/heads/rust/typescript-deprecation'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout exact migration branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: rust/typescript-deprecation
          fetch-depth: 20
          persist-credentials: true

      - name: Set up repository Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache-key: rust-typescript-deprecation-clippy-fix-final
          save-cache: false

      - name: Apply final test-only lint fix
        shell: python
        run: |
          from pathlib import Path

          parity = Path("packages/turbo-utils/rust/tests/project_parity.rs")
          text = parity.read_text(encoding="utf-8")
          old = "    let mut source = FakeSource::default();\n    source.example_exists = false;\n"
          new = (
              "    let source = FakeSource {\n"
              "        example_exists: false,\n"
              "        ..FakeSource::default()\n"
              "    };\n"
          )
          count = text.count(old)
          if count > 1:
              raise SystemExit(f"expected at most one default-then-reassign initializer, found {count}")
          if count == 1:
              parity.write_text(text.replace(old, new), encoding="utf-8")

      - name: Validate formatted, compiled, tested, and lint-clean result
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo check --locked -p turbo-ignore-rs -p turbo-utils-rs --all-targets
          cargo test --locked -p turbo-ignore-rs -p turbo-utils-rs --all-targets
          cargo clippy --locked -p turbo-ignore-rs -p turbo-utils-rs --all-targets -- -D warnings

      - name: Remove one-shot workflow and validate scope
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/rust-migration-clippy-fix.yml

          unexpected="$({
            git diff --name-only --diff-filter=ACMRTUXB
            git diff --name-only --diff-filter=D
          } | sort -u | grep -Ev '^(packages/turbo-utils/rust/tests/project_parity\.rs|\.github/workflows/rust-migration-clippy-fix\.yml$)' || true)"

          if [[ -n "$unexpected" ]]; then
            printf 'Clippy cleanup touched files outside the approved scope:\n%s\n' "$unexpected" >&2
            exit 1
          fi

          git diff --check

      - name: Commit and push without rewriting concurrent history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            packages/turbo-utils/rust/tests/project_parity.rs \
            .github/workflows/rust-migration-clippy-fix.yml
          git commit -m 'fix: Complete Rust migration lint cleanup'

          for attempt in 1 2 3 4 5; do
            git fetch origin rust/typescript-deprecation
            git rebase origin/rust/typescript-deprecation
            cargo fmt --all --check
            if git push origin HEAD:rust/typescript-deprecation; then
              exit 0
            fi
            sleep "$attempt"
          done

          echo 'Unable to fast-forward the migration branch after five rebase attempts.' >&2
          exit 1
