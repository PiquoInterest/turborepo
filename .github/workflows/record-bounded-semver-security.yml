name: Record bounded package-manager matcher security evidence

on:
  push:
    branches:
      - rust/typescript-deprecation
    paths:
      - .github/workflows/record-bounded-semver-security.yml
      - tools/migration/record_bounded_semver_security.py

concurrency:
  group: record-bounded-semver-security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate-and-record:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout the single migration branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: rust/typescript-deprecation
          fetch-depth: 0

      - name: Verify the sequential TDD chain
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "PiquoInterest/turborepo"
          test "$GITHUB_REF_NAME" = "rust/typescript-deprecation"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          for commit in \
            3d0d7d63950f21acf4604536fdaffbfffa335798 \
            816216a20b5620ab381842e26ed322d9409b3cec \
            a47192630977ffec2a4208f67d01fbd948a8aa97 \
            149f43f4662d8ab3f44b35a2b21e4e3bfd8c3c31 \
            6fbab195a23fd567891a9c7e31f820534c83a0a6 \
            1873ad057e82b58f1efdd8dc0614c71ae4bc5f96; do
            git merge-base --is-ancestor "$commit" HEAD
          done
          grep -Fq '" 1.2.3"' packages/turbo-workspaces/__tests__/install-meta.test.ts
          grep -Fq 'it.failing' packages/turbo-workspaces/__tests__/install-meta.test.ts
          grep -Fq '"6.x" => Ok(version.major == 6)' \
            packages/create-turbo/rust/src/package_manager_install_policy.rs
          ! grep -Fq 'RED stub' \
            packages/create-turbo/rust/src/package_manager_install_policy.rs

      - name: Set up the repository Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          cache: false
          save-cache: false

      - name: Revalidate the committed GREEN implementation
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo check --locked -p create-turbo-rs --all-targets
          cargo test --locked -p create-turbo-rs --all-targets
          cargo clippy --locked -p create-turbo-rs --all-targets -- -D warnings

      - name: Apply canonical security and parity records
        run: python3 tools/migration/record_bounded_semver_security.py

      - name: Verify the evidence delta
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 <<'PY'
          import subprocess

          expected = {
              ".github/workflows/record-bounded-semver-security.yml",
              "tools/migration/record_bounded_semver_security.py",
              "packages/create-turbo/rust/README.md",
              "packages/create-turbo/rust/PARITY_MATRIX.md",
              "packages/create-turbo/rust/SECURITY.md",
              "packages/create-turbo/rust/security.txt",
              "docs/typescript-deprecation.md",
              "docs/rust-migration-security-findings.md",
          }
          changed = set(
              subprocess.check_output(
                  ["git", "status", "--short"], text=True
              ).splitlines()
          )
          paths = {line[3:] for line in changed}
          if paths != expected:
              raise SystemExit(
                  f"unexpected bounded-semver evidence paths: {sorted(paths)}"
              )
          PY
          grep -Fq '### CT-RS-036:' packages/create-turbo/rust/SECURITY.md
          grep -Fq '### CT-RS-037:' packages/create-turbo/rust/SECURITY.md
          grep -Fq '### CT-RS-038:' packages/create-turbo/rust/SECURITY.md
          grep -Fq '### RF-027:' docs/rust-migration-security-findings.md
          grep -Fq 'Rust-GREEN: a47192630977ffec2a4208f67d01fbd948a8aa97' \
            packages/create-turbo/rust/security.txt
          grep -Fq 'docs/rust-migration-test-inventory.md' \
            docs/typescript-deprecation.md
          test ! -e tools/migration/record_bounded_semver_security.py
          test ! -e .github/workflows/record-bounded-semver-security.yml

      - name: Commit and publish the canonical records
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs(create-turbo): Record matcher security and test debt"

          remote_head="$(
            git ls-remote origin refs/heads/rust/typescript-deprecation |
              awk 'NR == 1 { print $1 }'
          )"
          if [[ "$remote_head" != "$GITHUB_SHA" ]]; then
            echo "migration branch moved during evidence validation: $remote_head" >&2
            exit 1
          fi
          GIT_TERMINAL_PROMPT=0 git push origin HEAD:rust/typescript-deprecation
