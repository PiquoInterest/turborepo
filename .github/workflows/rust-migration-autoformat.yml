name: Rust migration one-shot formatting

on:
  push:
    branches:
      - rust/typescript-deprecation
    paths:
      - .github/workflows/rust-migration-autoformat.yml

permissions:
  contents: write

concurrency:
  group: rust-migration-one-shot-format
  cancel-in-progress: false

jobs:
  format:
    if: >-
      github.repository == 'PiquoInterest/turborepo' &&
      github.ref == 'refs/heads/rust/typescript-deprecation'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout exact migration branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: rust/typescript-deprecation
          fetch-depth: 1
          persist-credentials: true

      - name: Install pinned Rust formatter
        uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7
        with:
          toolchain: nightly-2026-05-22
          components: rustfmt
          cache: false

      - name: Format migration crates
        shell: bash
        run: cargo fmt --all

      - name: Remove one-shot workflow and validate scope
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/rust-migration-autoformat.yml

          unexpected="$({
            git diff --name-only --diff-filter=ACMRTUXB
            git diff --name-only --diff-filter=D
          } | sort -u | grep -Ev '^(packages/turbo-ignore/rust/|packages/turbo-utils/rust/|\.github/workflows/rust-migration-autoformat\.yml$)' || true)"

          if [[ -n "$unexpected" ]]; then
            printf 'rustfmt touched files outside the approved migration scope:\n%s\n' "$unexpected" >&2
            exit 1
          fi

          git diff --check

      - name: Commit formatting without rewriting history
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No formatting changes were required.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            packages/turbo-ignore/rust \
            packages/turbo-utils/rust \
            .github/workflows/rust-migration-autoformat.yml
          git commit -m 'style: Format Rust project creation tranche'
          git push origin HEAD:rust/typescript-deprecation
