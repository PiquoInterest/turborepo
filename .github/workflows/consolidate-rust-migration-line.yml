name: Enforce the single Rust migration line

on:
  push:
    branches:
      - rust/typescript-deprecation
    paths:
      - .github/workflows/consolidate-rust-migration-line.yml

concurrency:
  group: consolidate-rust-migration-line
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout complete integration history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: rust/typescript-deprecation
          fetch-depth: 0

      - name: Persist the one-branch operating rule
        shell: python
        run: |
          from pathlib import Path

          path = Path("AGENTS.md")
          text = path.read_text(encoding="utf-8")
          old_one = "- Keep one integration line: `rust/typescript-deprecation` and its repository-wide pull request. Focused branches must target that branch, must be merged into it in dependency order, and must be closed once their exact history and reviewed content are consolidated. Do not open competing repository-wide migration PRs and do not push migration work directly to `main`."
          new_one = "- Keep exactly one migration branch and one migration pull request: `rust/typescript-deprecation` and its repository-wide PR to `main`. Commit RED tests, GREEN implementations, security regressions, documentation, and repairs directly to that branch. Do not create focused migration branches or competing migration PRs, and do not push migration work directly to `main`."
          old_two = "- Push each completed migration tranche to the existing integration pull request. Use a focused branch only when preserving an auditable RED-first commit requires it; merge that branch into `rust/typescript-deprecation` promptly after its applicable gates pass, then close the duplicate pull request and continue on the integration line."
          new_two = "- Preserve auditable RED-first history as consecutive commits on `rust/typescript-deprecation`; a focused branch is not required for TDD evidence. Every completed tranche remains visible in the existing integration pull request."
          for old, new in ((old_one, new_one), (old_two, new_two)):
              if new in text:
                  continue
              if text.count(old) != 1:
                  raise SystemExit(f"AGENTS.md migration-policy anchor changed: {old[:80]!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")

      - name: Commit the policy and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/consolidate-rust-migration-line.yml
          git add AGENTS.md
          git commit -m "chore: Enforce the single Rust migration branch"
          git pull --rebase origin rust/typescript-deprecation
          git push origin HEAD:rust/typescript-deprecation

      - name: Delete only fully integrated migration refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'
          branches=(
            automation/rust-migration-33377915830
            rust/create-turbo-directory-prompt
            rust/create-turbo-directory-security
            rust/create-turbo-directory-security-v2
            rust/create-turbo-error-policy
            rust/create-turbo-git-ignore
            rust/create-turbo-git-init
            rust/create-turbo-install-policy
            rust/create-turbo-official-starter
            rust/create-turbo-readme-transform
            rust/create-turbo-terminal-security
            rust/create-turbo-transform-pipeline
            rust/repository-wide-parity
            rust/security-advisory-upgrades
            rust/turbo-telemetry-parity
            rust/turbo-utils-managers
          )
          for branch in "${branches[@]}"; do
            remote_ref="refs/remotes/origin/${branch}"
            if ! git show-ref --verify --quiet "$remote_ref"; then
              continue
            fi
            if ! git merge-base --is-ancestor "$remote_ref" HEAD; then
              echo "Refusing to delete unintegrated branch: $branch" >&2
              exit 1
            fi
          done
          for branch in "${branches[@]}"; do
            remote_ref="refs/remotes/origin/${branch}"
            if git show-ref --verify --quiet "$remote_ref"; then
              git push origin --delete "$branch"
            fi
          done
