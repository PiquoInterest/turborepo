name: Repair network authority bounds v2

on:
  push:
    branches:
      - rust/typescript-deprecation
    paths:
      - .github/workflows/repair-network-authority-bounds-v2.yml

concurrency:
  group: repair-network-authority-bounds-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FORCE_COLOR: "0"
      TURBO_TELEMETRY_MESSAGE_DISABLED: "1"

    steps:
      - name: Checkout the sole migration branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: rust/typescript-deprecation
          fetch-depth: 0

      - name: Verify repository and branch identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "PiquoInterest/turborepo"
          test "$GITHUB_REF_NAME" = "rust/typescript-deprecation"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up the repository Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          cache: "false"
          save-cache: "false"

      - name: Prove the committed network contract is RED
        shell: bash
        run: |
          set -euo pipefail
          set +e
          cargo test --locked -p turbo-utils-rs --test network_authority_bounds \
            >/tmp/network-authority-red.log 2>&1
          status=$?
          set -e
          cat /tmp/network-authority-red.log
          test "$status" -ne 0
          grep -Fq "explicit_default_https_port_receives_github_authorization" \
            /tmp/network-authority-red.log
          grep -Fq "oversized_request_urls_fail_closed_across_policy_entrypoints" \
            /tmp/network-authority-red.log

      - name: Implement bounded normalized request authority
        id: implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"{label} anchor changed")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          network = Path("packages/turbo-utils/rust/src/network.rs")
          replace_once(
              network,
              'pub const REDIRECT_MAX_HOPS: usize = 10;\n',
              'pub const REDIRECT_MAX_HOPS: usize = 10;\n'
              '/// Maximum accepted request URL length in UTF-8 bytes.\n'
              'pub const REQUEST_URL_MAX_BYTES: usize = 8 * 1_024;\n',
              "request URL limit",
          )
          replace_once(
              network,
              '''fn parse_absolute_url(value: &str) -> Option<ParsedUrl<'_>> {
              if value.is_empty()
                  || value
          ''',
              '''fn parse_absolute_url(value: &str) -> Option<ParsedUrl<'_>> {
              if value.is_empty()
                  || value.len() > REQUEST_URL_MAX_BYTES
                  || value
          ''',
              "absolute URL boundary",
          )
          replace_once(
              network,
              '''fn is_github_api_endpoint(url: ParsedUrl<'_>) -> bool {
              url.scheme.eq_ignore_ascii_case("https")
                  && (url.authority.eq_ignore_ascii_case("api.github.com")
                      || url.authority.eq_ignore_ascii_case("codeload.github.com"))
          }
          ''',
              '''fn is_github_api_endpoint(url: ParsedUrl<'_>) -> bool {
              if !url.scheme.eq_ignore_ascii_case("https") {
                  return false;
              }

              let Some((host, port, bracketed)) = split_host_port(url.authority) else {
                  return false;
              };
              !bracketed
                  && matches!(port, None | Some(443))
                  && (host.eq_ignore_ascii_case("api.github.com")
                      || host.eq_ignore_ascii_case("codeload.github.com"))
          }
          ''',
              "GitHub effective authority",
          )

          security = Path("packages/turbo-utils/rust/tests/network_security.rs")
          replace_once(
              security,
              "fn github_authorization_requires_https_without_credentials_or_ports() {",
              "fn github_authorization_requires_https_without_credentials_or_non_default_ports() {",
              "stale network security test name",
          )
          replace_once(
              security,
              '        "https://api.github.com:443/repos/user/repo",\n',
              "",
              "stale explicit default-port rejection",
          )
          PY

          rustfmt --edition 2024 \
            packages/turbo-utils/rust/src/network.rs \
            packages/turbo-utils/rust/tests/network_authority_bounds.rs \
            packages/turbo-utils/rust/tests/network_security.rs
          python3 <<'PY'
          import subprocess

          allowed = {
              "packages/turbo-utils/rust/src/network.rs",
              "packages/turbo-utils/rust/tests/network_authority_bounds.rs",
              "packages/turbo-utils/rust/tests/network_security.rs",
          }
          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only"], text=True
              ).splitlines()
          )
          required = {
              "packages/turbo-utils/rust/src/network.rs",
              "packages/turbo-utils/rust/tests/network_security.rs",
          }
          if not required <= changed:
              raise SystemExit(
                  f"required network repair paths are missing: {sorted(required - changed)}"
              )
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(f"unexpected rustfmt or repair paths: {unexpected}")
          PY

          rustfmt --edition 2024 --check \
            packages/turbo-utils/rust/src/network.rs \
            packages/turbo-utils/rust/tests/network_authority_bounds.rs \
            packages/turbo-utils/rust/tests/network_security.rs
          cargo check --locked -p turbo-utils-rs --all-targets
          cargo test --locked -p turbo-utils-rs --test network_authority_bounds
          cargo test --locked -p turbo-utils-rs --test network_security
          cargo test --locked -p turbo-utils-rs --all-targets
          cargo clippy --locked -p turbo-utils-rs --all-targets -- -D warnings
          if grep -R --line-number --fixed-strings 'unsafe {' \
            packages/turbo-utils/rust/src/network.rs \
            packages/turbo-utils/rust/tests/network_authority_bounds.rs \
            packages/turbo-utils/rust/tests/network_security.rs; then
            echo "network authority repair introduced unsafe code" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/turbo-utils/rust/src/network.rs \
            packages/turbo-utils/rust/tests/network_security.rs
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m "fix(turbo-utils): Bound and normalize request authorities"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          if ! git diff --quiet -- \
            packages/turbo-utils/rust/tests/network_authority_bounds.rs; then
            git add packages/turbo-utils/rust/tests/network_authority_bounds.rs
            test "$(git diff --cached --name-only)" = \
              "packages/turbo-utils/rust/tests/network_authority_bounds.rs"
            git diff --cached --check
            git commit -m "style(turbo-utils): Format network authority bounds contract"
          fi
          echo "formatted_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Record network security evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - \
            "${{ steps.implementation.outputs.source_sha }}" \
            "${{ steps.implementation.outputs.formatted_sha }}" <<'PY'
          from pathlib import Path
          import sys

          source_sha, formatted_sha = sys.argv[1:3]

          security = Path("packages/turbo-utils/rust/SECURITY.md")
          text = security.read_text(encoding="utf-8")
          old = '''## TU-022: GitHub bearer credentials can cross an insecure transport boundary

          **TypeScript behavior:** `getGitHubAuthHeaders` parses the URL and checks only `hostname` against `api.github.com` and `codeload.github.com`. Because `URL.hostname` omits scheme, credentials, and port, the helper can attach a bearer token to plaintext `http://api.github.com/...` or to an explicitly redirected/custom port on an otherwise matching hostname.

          **Impact:** a token can be disclosed to an insecure transport or to a service reached through a nonstandard authority. The effect depends on network and redirect behavior, but the credential attachment decision itself is too broad.

          **Rust fix:** emit a bearer value only for syntactically valid, credential-free HTTPS URLs whose complete authority is exactly `api.github.com` or `codeload.github.com`, with no explicit port. Malformed URLs, look-alike domains, whitespace, controls, userinfo, HTTP, and custom ports receive no credential.

          **Intentional incompatibility:** hostname-equivalent URLs that are not exact HTTPS authorities no longer receive tokens.

          **Regressions:** `authorization_is_limited_to_exact_github_api_hosts`, `github_authorization_requires_https_without_credentials_or_ports`, and `malformed_and_control_bearing_urls_never_receive_credentials`.
          '''
          new = '''## TU-022: GitHub bearer credentials can cross an insecure transport boundary

          **TypeScript behavior:** `getGitHubAuthHeaders` parses the URL and checks only `hostname` against `api.github.com` and `codeload.github.com`. Because `URL.hostname` omits scheme, credentials, and port, the helper can attach a bearer token to plaintext `http://api.github.com/...` or to a custom port on an otherwise matching hostname.

          **Impact:** a token can be disclosed to an insecure transport or to a service reached through a nonstandard authority. The effect depends on network and redirect behavior, but the credential attachment decision itself is too broad.

          **Rust fix:** emit a bearer value only for syntactically valid, credential-free HTTPS URLs whose normalized host is exactly `api.github.com` or `codeload.github.com` and whose effective port is 443. Explicit `:443` is equivalent to the implicit HTTPS default. Malformed URLs, look-alike domains, whitespace, controls, userinfo, HTTP, and non-default ports receive no credential.

          **Intentional incompatibility:** hostname-equivalent URLs outside the credential-free HTTPS default-port origin no longer receive tokens.

          **Regressions:** `authorization_is_limited_to_exact_github_api_hosts`, `github_authorization_requires_https_without_credentials_or_non_default_ports`, `explicit_default_https_port_receives_github_authorization`, and `malformed_and_control_bearing_urls_never_receive_credentials`.
          '''
          if text.count(old) != 1:
              raise SystemExit("TU-022 evidence anchor changed")
          text = text.replace(old, new, 1)

          marker = "## Advisory lookup record"
          if text.count(marker) != 1:
              raise SystemExit("advisory lookup marker changed")
          finding = f'''## TU-031: Unbounded request URLs expand parser and redirect state

          **Severity:** Medium

          **TypeScript behavior:** request URLs are accepted without a shared size boundary before parsing, proxy selection, credential routing, or redirect-state updates.

          **Impact:** a caller-controlled URL can force disproportionate scanning and allocation and can carry an oversized value into redirect-chain state. Credential and proxy decisions must not succeed on input that the bounded request layer would reject.

          **Rust fix:** the shared absolute-URL parser rejects values above 8,192 UTF-8 bytes. The boundary is applied before GitHub authorization, proxy selection, redirect-origin comparison, initial chain creation, and redirect mutation. A rejected target leaves the current URL, policy, and hop count unchanged.

          **Intentional incompatibility:** oversized URLs fail closed with no authorization header and a typed `InvalidRequestUrl` error instead of being interpreted or retained.

          **Regressions:** `request_url_boundary_preserves_safe_input`, `oversized_request_urls_fail_closed_across_policy_entrypoints`, and `oversized_redirect_target_does_not_mutate_chain_state`.

          TDD evidence: RED `4c3a403017046d9c1d922d6ba6bdd1b7fb621b2c`, GREEN `{source_sha}`, formatting `{formatted_sha}`.

          '''
          text = text.replace(marker, finding + marker, 1)
          security.write_text(text, encoding="utf-8")

          repository = Path("docs/rust-migration-security-findings.md")
          text = repository.read_text(encoding="utf-8")
          marker = "## Required repository gates"
          if text.count(marker) != 1:
              raise SystemExit("repository gate marker changed")
          finding = f'''### RF-026: Request authority normalization and URL bounds were incomplete

          **Status:** Fixed in the Rust network-policy core; production request execution remains blocked.

          The network core previously compared raw GitHub authorities, so an explicit default HTTPS port was treated as a different origin, while request URLs had no shared input-size boundary. The corrected policy normalizes the effective HTTPS port for exact GitHub API hosts, continues to reject userinfo and non-default ports, and rejects URLs above 8,192 UTF-8 bytes before authorization, proxy, or redirect-state decisions.

          Rejected redirect targets cannot mutate the chain URL, authorization/proxy policy, or hop count. The change adds no dependency, parser crate, network call, subprocess, credential source, or unsafe code.

          TDD evidence is RED `4c3a403017046d9c1d922d6ba6bdd1b7fb621b2c`, GREEN `{source_sha}`, and formatting `{formatted_sha}`. Regression coverage is in `packages/turbo-utils/rust/tests/network_authority_bounds.rs` and `network_security.rs`.

          Production closure still requires one bounded request executor with explicit TLS, DNS/rebinding, proxy application, redirect, timeout, response-size, cancellation, and credential-redaction behavior across Linux, macOS, and Windows.

          '''
          text = text.replace(marker, finding + marker, 1)
          repository.write_text(text, encoding="utf-8")
          PY

          git add \
            packages/turbo-utils/rust/SECURITY.md \
            docs/rust-migration-security-findings.md
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m "docs(rust): Record network authority boundary evidence"

      - name: Validate and push the repair
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2024 --check \
            packages/turbo-utils/rust/src/network.rs \
            packages/turbo-utils/rust/tests/network_authority_bounds.rs \
            packages/turbo-utils/rust/tests/network_security.rs
          cargo check --locked -p turbo-utils-rs --all-targets
          cargo test --locked -p turbo-utils-rs --all-targets
          cargo clippy --locked -p turbo-utils-rs --all-targets -- -D warnings
          git diff --check
          test -z "$(git status --porcelain)"

          remote_head="$(
            git ls-remote origin refs/heads/rust/typescript-deprecation |
              awk '{print $1}'
          )"
          if [[ "$remote_head" != "$GITHUB_SHA" ]]; then
            echo "integration branch moved during validation: $remote_head" >&2
            exit 1
          fi
          git push origin HEAD:rust/typescript-deprecation
