name: Apply create-command error-policy migration documentation

on:
  push:
    branches:
      - rust/create-turbo-error-policy
    paths:
      - .github/workflows/apply-create-error-policy-docs.yml
      - tools/migration/apply_create_error_policy_docs.py

concurrency:
  group: create-error-policy-docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate-and-document:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FORCE_COLOR: "0"
      TURBO_TELEMETRY_MESSAGE_DISABLED: "1"
    steps:
      - name: Checkout the focused branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: rust/create-turbo-error-policy
          fetch-depth: 0

      - name: Set up the repository Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          cache: false
          save-cache: false

      - name: Validate the Rust error-policy tranche
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo check --locked -p create-turbo-rs --all-targets
          cargo test --locked -p create-turbo-rs --all-targets
          cargo clippy --locked -p create-turbo-rs --all-targets -- -D warnings

      - name: Set up Node and install the locked workspace
        uses: ./.github/actions/setup-node
        with:
          node-version: 22

      - name: Validate the legacy expected-failure security evidence
        run: |
          set -euo pipefail
          pnpm --filter @turbo/workspaces exec tsdown
          pnpm --filter create-turbo exec jest --runInBand __tests__/create-error-security.test.ts

      - name: Install repository Turbo build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes capnproto
          capnp --version

      - name: Set up the repository Zig toolchain
        uses: ./.github/actions/setup-zig
        with:
          version: "0.15.2"

      - name: Prepare a temporary coherent Biome graph
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path("Cargo.toml")
          text = path.read_text(encoding="utf-8")
          replacements = {
              'biome_diagnostics = { version = "0.5.7" }': 'biome_diagnostics = { version = "=0.5.7" }',
              'biome_formatter = { version = "0.5.7" }': 'biome_formatter = { version = "=0.5.7" }',
              'biome_json_parser = { version = "0.5.7" }': 'biome_json_parser = { version = "=0.5.7" }',
              'biome_json_formatter = { version = "0.5.7" }': 'biome_json_formatter = { version = "=0.5.7" }',
              'biome_json_syntax = { version = "0.5.7" }': 'biome_json_syntax = { version = "=0.5.7" }',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"Cargo.toml dependency anchor changed: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY

          package_is_locked() {
            python3 - "$1" "$2" <<'PY'
          import sys
          import tomllib
          from pathlib import Path

          name, version = sys.argv[1:]
          lock = tomllib.loads(Path("Cargo.lock").read_text(encoding="utf-8"))
          present = any(
              package.get("name") == name and package.get("version") == version
              for package in lock.get("package", [])
          )
          raise SystemExit(0 if present else 1)
          PY
          }

          downgrade_if_locked() {
            local name="$1"
            local from_version="$2"
            local to_version="$3"
            if package_is_locked "$name" "$from_version"; then
              cargo update -p "$name@$from_version" --precise "$to_version"
            fi
          }

          downgrade_if_locked biome_console 0.5.8 0.5.7
          downgrade_if_locked biome_diagnostics 0.5.8 0.5.7
          downgrade_if_locked biome_parser 0.5.8 0.5.7
          downgrade_if_locked biome_rowan 0.5.8 0.5.7
          downgrade_if_locked biome_string_case 0.5.8 0.5.7
          downgrade_if_locked biome_text_edit 0.5.8 0.5.7
          downgrade_if_locked biome_text_size 0.5.8 0.5.7
          downgrade_if_locked biome_unicode_table 0.5.9 0.5.7

          python3 <<'PY'
          import tomllib
          from pathlib import Path

          lock = tomllib.loads(Path("Cargo.lock").read_text(encoding="utf-8"))
          mismatches = {
              package["name"]: package["version"]
              for package in lock.get("package", [])
              if package.get("name", "").startswith("biome_")
              and package.get("version", "").startswith("0.5.")
              and package.get("version") != "0.5.7"
          }
          if mismatches:
              raise SystemExit(f"Biome dependency family is still incoherent: {mismatches}")
          PY

      - name: Build the exact repository Turbo for the pre-push hook
        run: |
          set -euo pipefail
          cargo build --locked -p turbo --bin turbo
          test -x "$GITHUB_WORKSPACE/target/debug/turbo"
          echo "$GITHUB_WORKSPACE/target/debug" >> "$GITHUB_PATH"
          "$GITHUB_WORKSPACE/target/debug/turbo" --version

      - name: Restore the focused tranche dependency files
        run: |
          set -euo pipefail
          git restore --source=HEAD -- Cargo.toml Cargo.lock
          git diff --exit-code -- Cargo.toml Cargo.lock
          test -x "$GITHUB_WORKSPACE/target/debug/turbo"

      - name: Record parity, security, and divergence evidence
        run: python tools/migration/apply_create_error_policy_docs.py

      - name: Commit and push the reviewed documentation through repository hooks
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            .github/workflows/apply-create-error-policy-docs.yml \
            .github/workflows/validate-create-turbo-error-policy.yml \
            tools/migration/apply_create_error_policy_docs.py \
            packages/create-turbo/rust/CREATE_ERROR_POLICY_DIVERGENCES.md \
            packages/create-turbo/rust/README.md \
            packages/create-turbo/rust/PARITY_MATRIX.md \
            packages/create-turbo/rust/SECURITY.md \
            docs/typescript-deprecation.md \
            docs/rust-migration-security-findings.md
          git diff --cached --check
          git commit -m "docs: Record create error-policy security divergences"
          git push origin HEAD:rust/create-turbo-error-policy
