name: Continue Rust migration repair

on:
  push:
    branches:
      - rust/typescript-deprecation
    paths:
      - .github/workflows/continue-rust-migration.yml

concurrency:
  group: continue-rust-migration-repair-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout the integration branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: rust/typescript-deprecation
          fetch-depth: 0

      - name: Set up the repository Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          cache: false
          save-cache: false

      - name: Remove test-only expect policy violations
        shell: python
        run: |
          from pathlib import Path

          def replace_helper(path_text: str, type_name: str, call_name: str) -> None:
              path = Path(path_text)
              text = path.read_text(encoding="utf-8")
              old = f'''fn written_package(store: &{type_name}) -> &{call_name} {{
                  store
                      .calls
                      .iter()
                      .find_map(|call| match call {{
                          {"Call" if type_name == "FakeStore" else "SecurityCall"}::WritePackage(_, package_json) => Some(package_json),
                          _ => None,
                      }})
                      .expect("the test expects one package.json write")
              }}
              '''
              enum_name = "Call" if type_name == "FakeStore" else "SecurityCall"
              new = f'''fn written_package(store: &{type_name}) -> &{call_name} {{
                  let package_json = store.calls.iter().find_map(|call| match call {{
                      {enum_name}::WritePackage(_, package_json) => Some(package_json),
                      _ => None,
                  }});
                  let Some(package_json) = package_json else {{
                      panic!("the test expects one package.json write");
                  }};
                  package_json
              }}
              '''
              if text.count(old) != 1:
                  raise SystemExit(f"official-starter helper anchor changed in {path}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_helper(
              "packages/create-turbo/rust/tests/official_starter_parity.rs",
              "FakeStore",
              "FakePackage",
          )
          replace_helper(
              "packages/create-turbo/rust/tests/official_starter_security.rs",
              "SecurityStore",
              "SecurityPackage",
          )

      - name: Format and validate the official-starter tranche
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all --check
          cargo check --locked -p create-turbo-rs --all-targets
          cargo test --locked -p create-turbo-rs --all-targets
          cargo clippy --locked -p create-turbo-rs --all-targets -- -D warnings

      - name: Record parity, security, and divergence evidence
        run: python tools/migration/apply_official_starter_docs.py

      - name: Restore durable workflow and commit reviewed output
        run: |
          set -euo pipefail
          git show 2a19dca610518102dfd04f2a64c24405d3c2b0cf:.github/workflows/continue-rust-migration.yml > .github/workflows/continue-rust-migration.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            .github/workflows/continue-rust-migration.yml \
            .github/workflows/apply-official-starter-docs.yml \
            tools/migration/apply_official_starter_docs.py \
            packages/create-turbo/rust \
            docs/typescript-deprecation.md \
            docs/rust-migration-security-findings.md
          git diff --cached --check
          git commit -m "docs: Record official-starter parity and divergences"
          git push origin HEAD:rust/typescript-deprecation
