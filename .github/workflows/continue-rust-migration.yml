name: Continue Rust migration repair

on:
  push:
    branches:
      - rust/typescript-deprecation
    paths:
      - .github/workflows/continue-rust-migration.yml

concurrency:
  group: continue-rust-migration-repair-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: rust/typescript-deprecation
          fetch-depth: 0

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          cache: false
          save-cache: false

      - name: Remove helper-only expect calls
        shell: python
        run: |
          import re
          from pathlib import Path

          pattern = re.compile(
              r'        self\.results\n\s+\.pop_front\(\)\n\s+\.expect\("([^"]+)"\)'
          )
          for relative in [
              "packages/create-turbo/rust/tests/transform_pipeline_parity.rs",
              "packages/create-turbo/rust/tests/transform_pipeline_security.rs",
          ]:
              path = Path(relative)
              text = path.read_text(encoding="utf-8")

              def replacement(match: re.Match[str]) -> str:
                  message = match.group(1)
                  return f'''        let result = self.results.pop_front();
                  let Some(result) = result else {{
                      panic!("{message}");
                  }};
                  result'''

              text, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f"expected one helper-only expect call in {relative}")
              path.write_text(text, encoding="utf-8")

      - name: Format and validate focused Rust crate
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all --check
          cargo check --locked -p create-turbo-rs --all-targets
          cargo test --locked -p create-turbo-rs --all-targets
          cargo clippy --locked -p create-turbo-rs --all-targets -- -D warnings

      - name: Record parity, security, and divergences
        run: python tools/migration/apply_transform_pipeline_docs.py

      - name: Restore durable workflow and commit reviewed tranche
        run: |
          set -euo pipefail
          git show 684fe7e471d5f7dc9e14f7f4b17e62e6f1297b54:.github/workflows/continue-rust-migration.yml > .github/workflows/continue-rust-migration.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            .github/workflows/continue-rust-migration.yml \
            tools/migration/apply_transform_pipeline_docs.py \
            packages/create-turbo/rust \
            docs/typescript-deprecation.md \
            docs/rust-migration-security-findings.md
          git diff --cached --check
          git commit -m "docs: Record transform-pipeline parity and divergences"
          git push origin HEAD:rust/typescript-deprecation
