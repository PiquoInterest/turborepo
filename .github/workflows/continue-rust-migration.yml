name: Continue Rust migration repair

on:
  push:
    branches:
      - rust/typescript-deprecation
    paths:
      - .github/workflows/continue-rust-migration.yml

concurrency:
  group: continue-rust-migration-repair-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: rust/typescript-deprecation
          fetch-depth: 0

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          cache: false
          save-cache: false

      - name: Format and validate focused Rust crate
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all --check
          cargo check --locked -p create-turbo-rs --all-targets
          cargo test --locked -p create-turbo-rs --all-targets
          cargo clippy --locked -p create-turbo-rs --all-targets -- -D warnings

      - name: Repair reviewed documentation anchor
        shell: python
        run: |
          from pathlib import Path

          path = Path("tools/migration/apply_package_manager_prompt_docs.py")
          text = path.read_text(encoding="utf-8")
          old = '"- interactive prompts;"'
          new = '"- CLI argument parsing, help/version output, and prompts;"'
          if text.count(old) != 1:
              raise SystemExit("package-manager prompt README anchor changed")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Record parity, security, and divergences
        run: python tools/migration/apply_package_manager_prompt_docs.py

      - name: Restore durable workflow and commit reviewed tranche
        run: |
          set -euo pipefail
          git show 9e1fee90855c15a6b18a7cfcb43958c64ffdc338:.github/workflows/continue-rust-migration.yml > .github/workflows/continue-rust-migration.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            .github/workflows/continue-rust-migration.yml \
            tools/migration/apply_package_manager_prompt_docs.py \
            packages/create-turbo/rust \
            docs/typescript-deprecation.md \
            docs/rust-migration-security-findings.md
          git diff --cached --check
          git commit -m "docs: Record package-manager prompt parity and divergences"
          git push origin HEAD:rust/typescript-deprecation
