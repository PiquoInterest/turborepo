name: Temporary create-turbo Rust lockfile bootstrap

on:
  push:
    branches:
      - rust/create-turbo-readme-transform

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: rust/create-turbo-readme-transform
          fetch-depth: 1

      - name: Set up repository Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: false

      - name: Generate only the workspace lockfile
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          git diff --exit-code -- Cargo.toml packages/create-turbo/rust/Cargo.toml

      - name: Commit generated lockfile when changed
        shell: bash
        run: |
          set -euo pipefail
          git add Cargo.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: Refresh create-turbo Rust lockfile'
          git push origin HEAD:rust/create-turbo-readme-transform
