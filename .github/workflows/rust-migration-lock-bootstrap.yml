name: Temporary create-turbo Rust validation

on:
  push:
    branches:
      - rust/create-turbo-readme-transform

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: rust/create-turbo-readme-transform
          fetch-depth: 1

      - name: Set up repository Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: false

      - name: Format and validate the focused Rust crate
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          cargo fmt --all
          cargo check --locked -p create-turbo-rs --all-targets
          cargo test --locked -p create-turbo-rs --all-targets
          cargo clippy --locked -p create-turbo-rs --all-targets -- -D warnings

      - name: Commit generated formatting or lockfile changes
        shell: bash
        run: |
          set -euo pipefail
          git add Cargo.lock packages/create-turbo/rust
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: Format create-turbo Rust tranche'
          git push origin HEAD:rust/create-turbo-readme-transform
