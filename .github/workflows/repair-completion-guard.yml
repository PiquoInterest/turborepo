name: Repair completion workflow guard

on:
  push:
    branches:
      - rust/typescript-deprecation
    paths:
      - .github/workflows/repair-completion-guard.yml

concurrency:
  group: repair-completion-guard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout the exact migration head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: rust/typescript-deprecation
          fetch-depth: 0

      - name: Replace the invalid literal self-check and atomically remove this repair workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "PiquoInterest/turborepo"
          test "$GITHUB_REF_NAME" = "rust/typescript-deprecation"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          remote_head="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/rust/typescript-deprecation" \
              --jq '.object.sha'
          )"
          test "$remote_head" = "$GITHUB_SHA"

          target=.github/workflows/complete-semver-telemetry-migration.yml
          python3 <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/complete-semver-telemetry-migration.yml")
          text = path.read_text(encoding="utf-8")
          old = '                  "19 shared edge rewrites",\n'
          new = '                  "actual_shared_edge_deltas",\n'
          if text.count(old) != 1:
              raise SystemExit("completion guard anchor changed")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          blob_sha="$(
            jq -n --rawfile content "$target" \
              '{content: $content, encoding: "utf-8"}' |
              gh api --method POST \
                "repos/${GITHUB_REPOSITORY}/git/blobs" \
                --input - --jq '.sha'
          )"
          base_tree="$(git rev-parse "${GITHUB_SHA}^{tree}")"
          tree_sha="$(
            jq -n \
              --arg base_tree "$base_tree" \
              --arg blob_sha "$blob_sha" \
              '{
                base_tree: $base_tree,
                tree: [
                  {
                    path: ".github/workflows/complete-semver-telemetry-migration.yml",
                    mode: "100644",
                    type: "blob",
                    sha: $blob_sha
                  },
                  {
                    path: ".github/workflows/repair-completion-guard.yml",
                    mode: "100644",
                    type: "blob",
                    sha: null
                  }
                ]
              }' |
              gh api --method POST \
                "repos/${GITHUB_REPOSITORY}/git/trees" \
                --input - --jq '.sha'
          )"
          commit_sha="$(
            jq -n \
              --arg message "ci(rust): Correct completion workflow self-check" \
              --arg tree "$tree_sha" \
              --arg parent "$GITHUB_SHA" \
              '{message: $message, tree: $tree, parents: [$parent]}' |
              gh api --method POST \
                "repos/${GITHUB_REPOSITORY}/git/commits" \
                --input - --jq '.sha'
          )"

          current_head="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/rust/typescript-deprecation" \
              --jq '.object.sha'
          )"
          test "$current_head" = "$GITHUB_SHA"

          jq -n --arg sha "$commit_sha" '{sha: $sha, force: false}' |
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/heads/rust/typescript-deprecation" \
              --input - >/dev/null

          echo "created guarded repair commit $commit_sha"
