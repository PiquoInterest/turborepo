name: Apply official-starter migration documentation

on:
  push:
    branches:
      - rust/typescript-deprecation
    paths:
      - .github/workflows/apply-official-starter-docs.yml
      - tools/migration/apply_official_starter_docs.py
      - packages/create-turbo/rust/src/official_starter.rs
      - packages/create-turbo/rust/src/lib.rs
      - packages/create-turbo/rust/tests/official_starter_parity.rs
      - packages/create-turbo/rust/tests/official_starter_security.rs

concurrency:
  group: official-starter-migration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate-and-document:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout the integration branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: rust/typescript-deprecation
          fetch-depth: 0

      - name: Set up the repository Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          cache: false
          save-cache: false

      - name: Validate the official-starter Rust tranche
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo check --locked -p create-turbo-rs --all-targets
          cargo test --locked -p create-turbo-rs --all-targets
          cargo clippy --locked -p create-turbo-rs --all-targets -- -D warnings

      - name: Record parity, security, and divergence evidence
        run: python tools/migration/apply_official_starter_docs.py

      - name: Commit the reviewed documentation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/apply-official-starter-docs.yml \
            tools/migration/apply_official_starter_docs.py \
            packages/create-turbo/rust/OFFICIAL_STARTER_DIVERGENCES.md \
            packages/create-turbo/rust/README.md \
            packages/create-turbo/rust/PARITY_MATRIX.md \
            packages/create-turbo/rust/SECURITY.md \
            docs/typescript-deprecation.md \
            docs/rust-migration-security-findings.md
          git diff --cached --check
          git commit -m "docs: Record official-starter parity and divergences"
          git push origin HEAD:rust/typescript-deprecation
