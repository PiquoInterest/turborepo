name: Finalize strict create-turbo Node-semver matcher v2

on:
  push:
    branches:
      - rust/typescript-deprecation
    paths:
      - .github/workflows/finalize-create-node-semver-v2.yml

concurrency:
  group: finalize-create-node-semver-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FORCE_COLOR: "0"
      TURBO_TELEMETRY_MESSAGE_DISABLED: "1"

    steps:
      - name: Checkout the sole migration branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: rust/typescript-deprecation
          fetch-depth: 0

      - name: Verify repository and branch identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "PiquoInterest/turborepo"
          test "$GITHUB_REF_NAME" = "rust/typescript-deprecation"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Patch the reviewed generator
        run: python3 tools/migration/repair_create_node_semver_matcher.py

      - name: Set up the repository Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          cache: false
          save-cache: false

      - name: Re-prove the compiling RED contract
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/create-node-semver-red \
            816216a20b5620ab381842e26ed322d9409b3cec
          set +e
          (
            cd /tmp/create-node-semver-red
            CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target/create-node-semver-red" \
              cargo test --locked -p create-turbo-rs \
                --test package_manager_install_policy_parity \
                --test package_manager_install_policy_security
          ) > /tmp/create-node-semver-red.log 2>&1
          status=$?
          set -e
          cat /tmp/create-node-semver-red.log
          test "$status" -ne 0
          ! grep -Fq 'could not compile' /tmp/create-node-semver-red.log
          grep -Fq 'test result: FAILED' /tmp/create-node-semver-red.log
          grep -Fq 'concrete_node_semver_matcher_selects_the_exact_source_profiles' \
            /tmp/create-node-semver-red.log
          git worktree remove --force /tmp/create-node-semver-red

      - name: Apply the GREEN implementation
        run: python3 tools/migration/apply_create_node_semver_matcher.py implement

      - name: Generate and constrain the lockfile delta
        shell: bash
        run: |
          set -euo pipefail
          cp Cargo.lock /tmp/create-node-semver-Cargo.lock.original
          cargo check -p create-turbo-rs --all-targets
          python3 <<'PY'
          import tomllib
          from pathlib import Path

          def load(path: str) -> dict:
              return tomllib.loads(Path(path).read_text(encoding="utf-8"))

          original = load("/tmp/create-node-semver-Cargo.lock.original")
          current = load("Cargo.lock")

          def key(package: dict) -> tuple[str, str, str]:
              return (
                  package["name"],
                  package["version"],
                  package.get("source", ""),
              )

          before = {key(package): package for package in original.get("package", [])}
          after = {key(package): package for package in current.get("package", [])}
          if set(before) != set(after):
              raise SystemExit("Node-semver update changed lockfile package identities")

          target = ("create-turbo-rs", "0.1.0", "")
          if target not in before or target not in after:
              raise SystemExit("create-turbo-rs lockfile record is missing")

          for package_key, original_package in before.items():
              current_package = after[package_key]
              if package_key == target:
                  original_dependencies = set(original_package.get("dependencies", []))
                  current_dependencies = set(current_package.get("dependencies", []))
                  if current_dependencies != original_dependencies | {"node-semver"}:
                      raise SystemExit(
                          "create-turbo-rs lockfile delta is not exactly node-semver"
                      )
                  original_metadata = dict(original_package)
                  current_metadata = dict(current_package)
                  original_metadata.pop("dependencies", None)
                  current_metadata.pop("dependencies", None)
                  if original_metadata != current_metadata:
                      raise SystemExit(
                          "create-turbo-rs lockfile metadata changed unexpectedly"
                      )
              elif original_package != current_package:
                  raise SystemExit(f"unreviewed lockfile record changed: {package_key}")

          versions = [
              package["version"]
              for package in current.get("package", [])
              if package.get("name") == "node-semver"
          ]
          if versions != ["2.2.0"]:
              raise SystemExit(f"expected node-semver 2.2.0, found {versions}")
          PY

      - name: Validate the GREEN Rust implementation
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all --check
          cargo check --locked -p create-turbo-rs --all-targets
          cargo test --locked -p create-turbo-rs --all-targets
          cargo clippy --locked -p create-turbo-rs --all-targets -- -D warnings
          if grep -R --line-number --fixed-strings 'unsafe {' \
            packages/create-turbo/rust/src/package_manager_install_policy.rs \
            packages/create-turbo/rust/tests/package_manager_install_policy_*.rs; then
            echo "Node-semver matcher introduced unsafe code" >&2
            exit 1
          fi

      - name: Set up Node and install the locked workspace
        uses: ./.github/actions/setup-node
        with:
          node-version: 24

      - name: Validate the TypeScript oracle and security evidence
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec oxfmt --check \
            packages/turbo-workspaces/__tests__/install-meta.test.ts
          pnpm --filter @turbo/workspaces exec jest --runInBand --coverage=false \
            __tests__/install-meta.test.ts \
            __tests__/install-security.test.ts

      - name: Commit the reviewed GREEN implementation
        id: green
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Cargo.toml \
            Cargo.lock \
            packages/create-turbo/rust/Cargo.toml \
            packages/create-turbo/rust/src/lib.rs \
            packages/create-turbo/rust/src/package_manager_install_policy.rs \
            packages/create-turbo/rust/tests/package_manager_install_policy_parity.rs
          git diff --cached --check
          git commit -m "feat(create-turbo): Implement strict bounded Node semver matcher"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Commit the isolated pre-existing rustfmt repair
        shell: bash
        run: |
          set -euo pipefail
          git add packages/turbo-utils/rust/tests/network_authority_bounds.rs
          test "$(git diff --cached --name-only)" = \
            "packages/turbo-utils/rust/tests/network_authority_bounds.rs"
          git diff --cached --check
          git commit -m "style(turbo-utils): Restore network authority rustfmt output"

      - name: Generate and validate migration evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/migration/apply_create_node_semver_matcher.py \
            document "${{ steps.green.outputs.sha }}"
          cargo fmt --all --check
          cargo check --locked -p create-turbo-rs --all-targets
          cargo test --locked -p create-turbo-rs --all-targets
          cargo clippy --locked -p create-turbo-rs --all-targets -- -D warnings
          test ! -e .github/workflows/apply-create-node-semver-matcher.yml
          test ! -e tools/migration/apply_create_node_semver_matcher.py
          grep -Fq 'CT-RS-036' packages/create-turbo/rust/SECURITY.md
          grep -Fq 'RF-026' docs/rust-migration-security-findings.md
          grep -Fq '${{ steps.green.outputs.sha }}' \
            packages/create-turbo/rust/PACKAGE_MANAGER_INSTALL_POLICY_DIVERGENCES.md

      - name: Remove all one-shot automation
        shell: bash
        run: |
          set -euo pipefail
          rm \
            .github/workflows/repair-create-node-semver-matcher.yml \
            .github/workflows/finalize-create-node-semver-matcher.yml \
            .github/workflows/finalize-create-node-semver-v2.yml \
            tools/migration/repair_create_node_semver_matcher.py

      - name: Commit the reviewed documentation
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          python3 <<'PY'
          import subprocess

          allowed = {
              ".github/workflows/apply-create-node-semver-matcher.yml",
              ".github/workflows/repair-create-node-semver-matcher.yml",
              ".github/workflows/finalize-create-node-semver-matcher.yml",
              ".github/workflows/finalize-create-node-semver-v2.yml",
              "tools/migration/apply_create_node_semver_matcher.py",
              "tools/migration/repair_create_node_semver_matcher.py",
              "packages/create-turbo/rust/PACKAGE_MANAGER_INSTALL_POLICY_DIVERGENCES.md",
              "packages/create-turbo/rust/README.md",
              "packages/create-turbo/rust/PARITY_MATRIX.md",
              "packages/create-turbo/rust/SECURITY.md",
              "docs/typescript-deprecation.md",
              "docs/rust-migration-security-findings.md",
          }
          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--cached", "--name-only"], text=True
              ).splitlines()
          )
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(f"unexpected documentation paths: {unexpected}")
          required = {
              ".github/workflows/apply-create-node-semver-matcher.yml",
              ".github/workflows/repair-create-node-semver-matcher.yml",
              ".github/workflows/finalize-create-node-semver-matcher.yml",
              ".github/workflows/finalize-create-node-semver-v2.yml",
              "tools/migration/apply_create_node_semver_matcher.py",
              "tools/migration/repair_create_node_semver_matcher.py",
          }
          missing = sorted(required - changed)
          if missing:
              raise SystemExit(f"one-shot automation was not removed: {missing}")
          PY
          git commit -m "docs(create-turbo): Record strict Node semver security"

      - name: Resolve the exact locked Turbo hook command
        shell: bash
        run: |
          set -euo pipefail
          resolved_version="$(
            pnpm --filter eslint-plugin-turbo exec node -p \
              'require("turbo/package.json").version'
          )"
          test "$resolved_version" = "2.8.3"

          turbo_wrapper="$(
            pnpm --filter eslint-plugin-turbo exec node -p \
              'require.resolve("turbo")'
          )"
          case "$turbo_wrapper" in
            "$GITHUB_WORKSPACE"/*) ;;
            *)
              echo "resolved Turbo wrapper escaped the workspace: $turbo_wrapper" >&2
              exit 1
              ;;
          esac
          test -x "$turbo_wrapper"

          mkdir -p "$RUNNER_TEMP/repository-bin"
          ln -s "$turbo_wrapper" "$RUNNER_TEMP/repository-bin/turbo"
          echo "$RUNNER_TEMP/repository-bin" >> "$GITHUB_PATH"
          "$turbo_wrapper" --version

      - name: Preflight the unchanged repository hook
        shell: bash
        run: |
          set -euo pipefail
          command -v turbo
          test "$(turbo --version)" = "2.8.3"
          sh .husky/pre-push
          test -z "$(git status --porcelain)"

      - name: Push through the unchanged repository hooks
        shell: bash
        run: |
          set -euo pipefail
          git config --unset-all remote.origin.pushurl || true
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          remote_head="$(
            git ls-remote origin refs/heads/rust/typescript-deprecation |
              awk '{print $1}'
          )"
          if [[ "$remote_head" != "$GITHUB_SHA" ]]; then
            echo "integration branch moved during validation: $remote_head" >&2
            exit 1
          fi
          test -z "$(git status --porcelain)"
          GIT_TERMINAL_PROMPT=0 git push origin HEAD:rust/typescript-deprecation
