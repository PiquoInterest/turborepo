name: Materialize semver and telemetry migration repair v4

on:
  push:
    branches:
      - rust/typescript-deprecation
    paths:
      - .github/workflows/resume-semver-telemetry-v4.yml

concurrency:
  group: resume-semver-telemetry-v4-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout the sole migration branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: rust/typescript-deprecation
          fetch-depth: 0

      - name: Verify repository and branch identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "PiquoInterest/turborepo"
          test "$GITHUB_REF_NAME" = "rust/typescript-deprecation"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Materialize the exact telemetry Clippy closure
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          source = Path(".github/workflows/complete-semver-telemetry-migration.yml")
          output = Path("tools/migration/generated-complete-semver-telemetry.yml")
          if output.exists():
              raise SystemExit("generated telemetry workflow handoff already exists")

          text = source.read_text(encoding="utf-8")
          old = """          bash -euo pipefail /tmp/apply-telemetry-path-boundary.sh
                    cargo fmt --all
          """
          new = """          bash -euo pipefail /tmp/apply-telemetry-path-boundary.sh
                    python3 <<'PY'
                    from pathlib import Path

                    path = Path("crates/turborepo-telemetry/src/events/package/config.rs")
                    text = path.read_text(encoding="utf-8")
                    old = "\\n".join(
                        [
                            "    if let Ok(metadata) = fs::symlink_metadata(path) {",
                            "        if metadata.file_type().is_symlink() || !metadata.is_file() {",
                            "            return Err(PackageTelemetryError::UnsafeConfigPath);",
                            "        }",
                            "    }",
                            "",
                        ]
                    )
                    new = "\\n".join(
                        [
                            "    if let Ok(metadata) = fs::symlink_metadata(path)",
                            "        && (metadata.file_type().is_symlink() || !metadata.is_file())",
                            "    {",
                            "        return Err(PackageTelemetryError::UnsafeConfigPath);",
                            "    }",
                            "",
                        ]
                    )
                    if text.count(old) != 1:
                        raise SystemExit("reviewed telemetry Clippy anchor changed")
                    path.write_text(text.replace(old, new, 1), encoding="utf-8")
                    PY
                    cargo fmt --all
          """
          if text.count(old) != 1:
              raise SystemExit(
                  f"telemetry workflow anchor count changed: {text.count(old)}"
              )
          if "workflow_dispatch:" in text:
              raise SystemExit("unreviewed dispatch authority is present")
          if "github.event_name == 'workflow_dispatch'" in text:
              raise SystemExit("unreviewed dispatch-only job guard is present")

          patched = text.replace(old, new, 1)
          if patched.count("reviewed telemetry Clippy anchor changed") != 1:
              raise SystemExit("telemetry Clippy closure was not materialized exactly once")
          output.write_text(patched, encoding="utf-8")
          PY

          git diff --no-index -- \
            .github/workflows/complete-semver-telemetry-migration.yml \
            tools/migration/generated-complete-semver-telemetry.yml || test "$?" -eq 1

      - name: Commit the non-workflow handoff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/migration/generated-complete-semver-telemetry.yml
          git diff --cached --check
          test "$(git diff --cached --name-only)" = \
            "tools/migration/generated-complete-semver-telemetry.yml"
          git commit -m "chore(rust): Materialize reviewed telemetry workflow repair"
          git push origin HEAD:rust/typescript-deprecation
