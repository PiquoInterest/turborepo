[package]
name = "turbo-workspaces-rs"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Rust migration of turbo-workspaces behavior"

[lib]
path = "src/lib.rs"

[workspace]
resolver = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(debug_assert)'] }

[lints.clippy]
expect_used = "deny"
too_many_arguments = "allow"
unwrap_used = "deny"
